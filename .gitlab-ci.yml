# 有本文件后 GitLab 不再走 Auto DevOps / Heroku buildpack。
# Linux runner：不做 iOS；不做 Android lint/单测（GitHub ubuntu-latest 自带 SDK，这里没有）。
#
# 不上传 artifacts：当前 runner 的 coordinator URL 是 http://gitlab，
# job 里 DNS 解析不到这个主机名，上传会把已经成功的 job 判失败。
# Web catalog 因此打进 Harbor 镜像再 kubectl apply，不走 GitLab Pages。
#
# 镜像推 Harbor，不走 GitLab Container Registry（CI_REGISTRY 为空会落到 Docker Hub）。
# 账号用 CI/CD Variables：DOCKER_USER / DOCKER_PASSWORD（masked），不要写进本文件。
# 发布还需要：KUBE_CONFIG_CHONGQING（或 KUBE_CONFIG / KUBE_CONFIG_B64），
# 以及 namespace 里的 harbor-registry-secret。

image: eclipse-temurin:21-jdk

stages:
  - image
  - lint
  - test
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEBIAN_FRONTEND: noninteractive
  HARBOR_REGISTRY: harbor.devops.toutiaoyan.com
  COMPOSE_CI_IMAGE: harbor.devops.toutiaoyan.com/web-foundation/compose-linux-desktop:24.04
  COMPOSE_WEB_IMAGE: harbor.devops.toutiaoyan.com/web-foundation/compose-foundation-web
  # GitLab runner 是 linux/amd64；本机 OrbStack 默认会打出 arm64。
  COMPOSE_CI_PLATFORM: linux/amd64
  K8S_NAMESPACE: compose-foundation
  K8S_DEPLOYMENT: compose-foundation-web
  K8S_CONTAINER: web

default:
  interruptible: true
  before_script:
    - chmod +x gradlew
    - echo "kotlin.native.ignoreDisabledTargets=true" >> gradle.properties

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Dockerfile 变更时自动 build + push 到 Harbor。
# runner 需要能 docker build（挂载 docker.sock，或启用 privileged + dind）。
build-compose-image:
  stage: image
  image: docker:24
  interruptible: true
  before_script: []
  script:
    - |
      if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASSWORD" ]; then
        echo "缺少 CI/CD 变量 DOCKER_USER / DOCKER_PASSWORD（masked）。Settings → CI/CD → Variables。"
        exit 1
      fi
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "$HARBOR_REGISTRY"
    - docker build --platform "$COMPOSE_CI_PLATFORM" -t "$COMPOSE_CI_IMAGE" ci/docker/compose-linux-desktop
    - docker push "$COMPOSE_CI_IMAGE"
  rules:
    - if: $FORCE_BUILD_CI_IMAGE == "true"
    - changes:
        - ci/docker/compose-linux-desktop/**/*

lint:
  stage: lint
  script:
    - ./gradlew ktlintCheck detekt --continue

# Harbor 私有镜像不能写在 job 的 image: 上：executor 拉镜像早于 script，
# 用不到 DOCKER_USER / DOCKER_PASSWORD。这里用 docker:24 登录后再 run。
# 虚拟屏起法和 JetBrains compose-multiplatform-core Desktop 测试一致。
test-desktop:
  stage: test
  image: docker:24
  needs:
    - job: build-compose-image
      optional: true
  before_script: []
  script:
    - |
      if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASSWORD" ]; then
        echo "缺少 CI/CD 变量 DOCKER_USER / DOCKER_PASSWORD（masked）。Settings → CI/CD → Variables。"
        exit 1
      fi
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "$HARBOR_REGISTRY"
    - docker pull "$COMPOSE_CI_IMAGE"
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR" \
        -e GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle" \
        -e GRADLE_OPTS \
        -w "$CI_PROJECT_DIR" \
        "$COMPOSE_CI_IMAGE" \
        bash -lc 'chmod +x gradlew
          echo "kotlin.native.ignoreDisabledTargets=true" >> gradle.properties
          Xvfb :1 -screen 0 1920x1080x24 -extension RANDR +extension GLX &
          export DISPLAY=:1.0
          exec ./gradlew jvmTest --continue'

# 多阶段镜像里编 catalog，避开 artifact 上传。Node 25 的 libatomic 在 Dockerfile 里装。
package-web:
  stage: deploy
  image: docker:24
  needs:
    - lint
    - test-desktop
  timeout: 60m
  before_script: []
  script:
    - |
      if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASSWORD" ]; then
        echo "缺少 CI/CD 变量 DOCKER_USER / DOCKER_PASSWORD（masked）。Settings → CI/CD → Variables。"
        exit 1
      fi
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "$HARBOR_REGISTRY"
    - |
      TAG_RESOLVED="${CI_COMMIT_SHORT_SHA}"
      FULL_IMAGE="${COMPOSE_WEB_IMAGE}:${TAG_RESOLVED}"
      docker build --platform "$COMPOSE_CI_PLATFORM" \
        -f ci/docker/compose-web/Dockerfile \
        -t "$FULL_IMAGE" \
        -t "${COMPOSE_WEB_IMAGE}:latest" \
        .
      docker push "$FULL_IMAGE"
      docker push "${COMPOSE_WEB_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 重庆集群。需要 CI 变量 KUBE_CONFIG_CHONGQING（kubeconfig 全文或文件型变量）。
deploy-web:
  stage: deploy
  image:
    name: alpine/k8s:1.31.4
    entrypoint: [""]
  needs:
    - package-web
  before_script: []
  script:
    - |
      set -euo pipefail
      TAG_RESOLVED="${CI_COMMIT_SHORT_SHA}"
      export FULL_IMAGE="${COMPOSE_WEB_IMAGE}:${TAG_RESOLVED}"
      mkdir -p ~/.kube
      if [ -n "${KUBE_CONFIG_B64:-}" ]; then
        echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
      elif [ -n "${KUBE_CONFIG_CHONGQING:-}" ] && [ -f "${KUBE_CONFIG_CHONGQING}" ]; then
        cp "${KUBE_CONFIG_CHONGQING}" ~/.kube/config
      elif [ -n "${KUBE_CONFIG_CHONGQING:-}" ]; then
        printf '%s\n' "$KUBE_CONFIG_CHONGQING" > ~/.kube/config
      elif [ -n "${KUBE_CONFIG:-}" ] && [ -f "${KUBE_CONFIG}" ]; then
        cp "${KUBE_CONFIG}" ~/.kube/config
      elif [ -n "${KUBE_CONFIG:-}" ]; then
        printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
      else
        echo "缺少 kubeconfig：配置 KUBE_CONFIG_CHONGQING（推荐）或 KUBE_CONFIG / KUBE_CONFIG_B64。" >&2
        exit 1
      fi
      export KUBECONFIG="${HOME}/.kube/config"
      bash "${CI_PROJECT_DIR}/scripts/k8s-deploy.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
