# 有本文件后 GitLab 不再走 Auto DevOps / Heroku buildpack。
# Linux runner：不做 iOS；不做 Android lint/单测（GitHub ubuntu-latest 自带 SDK，这里没有）。
#
# 不上传 artifacts：当前 runner 的 coordinator URL 是 http://gitlab，
# job 里 DNS 解析不到这个主机名，上传会把已经成功的 job 判失败。
#
# 镜像推 Harbor，不走 GitLab Container Registry（CI_REGISTRY 为空会落到 Docker Hub）。
# 密码用 CI/CD Variables：HARBOR_PASSWORD（masked），不要写进本文件。

image: eclipse-temurin:21-jdk

stages:
  - image
  - lint
  - test
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEBIAN_FRONTEND: noninteractive
  HARBOR_REGISTRY: harbor.devops.toutiaoyan.com
  HARBOR_USER: web-foundation
  COMPOSE_CI_IMAGE: harbor.devops.toutiaoyan.com/web-foundation/compose-linux-desktop:24.04

default:
  interruptible: true
  before_script:
    - chmod +x gradlew
    - echo "kotlin.native.ignoreDisabledTargets=true" >> gradle.properties

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Dockerfile 变更时自动 build + push 到 Harbor。
# runner 需要能 docker build（挂载 docker.sock，或启用 privileged + dind）。
build-compose-image:
  stage: image
  image: docker:24
  interruptible: true
  before_script: []
  script:
    - |
      if [ -z "$HARBOR_PASSWORD" ]; then
        echo "缺少 CI/CD 变量 HARBOR_PASSWORD（masked）。Settings → CI/CD → Variables。"
        exit 1
      fi
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_REGISTRY"
    - docker build -t "$COMPOSE_CI_IMAGE" ci/docker/compose-linux-desktop
    - docker push "$COMPOSE_CI_IMAGE"
  rules:
    - if: $FORCE_BUILD_CI_IMAGE == "true"
    - changes:
        - ci/docker/compose-linux-desktop/**/*

lint:
  stage: lint
  script:
    - ./gradlew ktlintCheck detekt --continue

# 虚拟屏起法和 JetBrains compose-multiplatform-core Desktop 测试一致。
test-desktop:
  stage: test
  image: $COMPOSE_CI_IMAGE
  needs:
    - job: build-compose-image
      optional: true
  before_script:
    - chmod +x gradlew
    - echo "kotlin.native.ignoreDisabledTargets=true" >> gradle.properties
    - Xvfb :1 -screen 0 1920x1080x24 -extension RANDR +extension GLX &
  script:
    - ./gradlew jvmTest --continue

# 编 catalog 作为编译检查。GitLab Pages 也依赖 artifacts 上传，
# runner URL 修好之前先不发布站点。
build-web:
  stage: deploy
  needs:
    - lint
    - test-desktop
  timeout: 60m
  script:
    - ./gradlew :app:webApp:composeCompatibilityBrowserDistribution
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
