#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Library publishing — Maven coordinates for :shadcn:core / :tailwind-core
GROUP=com.toutiaoyan.compose
VERSION_NAME=0.3.33

# BuildKonfig flavor: development | product（可用 -Pbuildkonfig.flavor=product 覆盖）
buildkonfig.flavor=development
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Android Preview screenshot test suites (AGP 9.5+, separate from JVM interaction tests).
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true
