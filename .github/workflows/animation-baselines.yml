name: Animation baselines

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Actions run on this commit with the non-desktop capture artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Resolve candidate run and baseline revision
    runs-on: ubuntu-24.04
    outputs:
      baseline_repo: ${{ steps.references.outputs.baseline_repo }}
      baseline_sha: ${{ steps.references.outputs.baseline_sha }}
      platforms: ${{ steps.references.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve references
        id: references
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")"
          if ! jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .conclusion == "success"' <<<"$run" >/dev/null; then
            echo 'Candidate run must have succeeded on this source commit.' >&2
            exit 1
          fi
          repository="$(jq -er '.baseline.repository' shadcn/validation/plan.json)"
          sha="$(jq -r '.baseline.revision // empty' shadcn/validation/plan.json)"
          if [[ -z "$sha" ]]; then
            sha="$(gh api "repos/$repository/commits/main" --jq .sha)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'baseline_repo=%s\nbaseline_sha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          printf 'platforms=%s\n' "$(jq -c '.platforms | keys' shadcn/validation/animation-plan.json)" >> "$GITHUB_OUTPUT"

  compare:
    name: Sheet / ${{ matrix.platform }}
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.baseline_repo }}
          ref: ${{ needs.resolve.outputs.baseline_sha }}
          path: build/animation-references
          sparse-checkout: animations/${{ matrix.platform }}/sheet-open
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: matrix.platform == 'cmp-desktop'
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'cmp-desktop'
      - name: Capture Desktop Sheet
        if: matrix.platform == 'cmp-desktop'
        run: |
          ./gradlew :shadcn:core:jvmTest --tests '*SheetAnimationBaselineTest' --rerun
          mkdir -p build/animation-candidates/cmp-desktop/sheet-open
          cp -r shadcn/shared/build/reports/animation-baselines/cmp-desktop/sheet-open/actual \
            build/animation-candidates/cmp-desktop/sheet-open/actual
      - uses: actions/download-artifact@v4
        if: matrix.platform != 'cmp-desktop'
        with:
          name: animation-candidate-${{ matrix.platform }}-sheet-open
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: build/animation-candidates/${{ matrix.platform }}/sheet-open/actual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Compare platform frames
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python shadcn/validation/animation_baseline.py "$PLATFORM" sheet-open --strict \
            --baselines build/animation-references/animations \
            --output build/animation-candidates
      - name: Upload comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animation-diffs-${{ matrix.platform }}-sheet-open
          path: |
            build/animation-candidates/*/sheet-open/comparison.gif
            build/animation-candidates/*/sheet-open/*-diff.png
          if-no-files-found: ignore

  gate:
    name: All platform animation baselines
    if: ${{ always() }}
    needs: [resolve, compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          RESOLVE: ${{ needs.resolve.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          [[ "$RESOLVE" == success && "$COMPARE" == success ]]
