name: Publish verified Android Sheet references
on:
  push:
    branches: [codex/publish-sheet-android]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Compare independent Android captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 46119170933 46120977722 46121676535; do
            gh run download "$run" -n animation-candidate-cmp-android-sheet-open-attempt-1 -D "$RUNNER_TEMP/$run"
          done
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          from collections import Counter
          import os
          root = Path(os.environ["RUNNER_TEMP"])
          for frame in ("before", "000", "096", "192", "224", "480"):
              print(frame)
              previous = None
              for run in ("46119170933", "46120977722", "46121676535"):
                  img = Image.open(root / run / (frame + ".png")).convert("RGB")
                  content = img.crop((0, 96, img.width, img.height))
                  diff = ImageChops.difference(previous, content).getbbox() if previous else None
                  print(run, Counter(content.resize((100, 200)).getdata()).most_common(3), diff)
                  previous = content
          PY
