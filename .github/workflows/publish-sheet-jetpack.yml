name: Publish verified Jetpack Sheet references
on:
  push:
    branches: [codex/publish-sheet-jetpack]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Compare independent Jetpack captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          platform=jetpack-compose
          base="$RUNNER_TEMP/reference/$platform/sheet-open"
          gh run download 46120977722 -n "animation-candidate-$platform-sheet-open-attempt-1" -D "$base"
          for replay in 46120538588 46120083893 46119244198 46119696300; do
            echo "Comparing against run $replay"
            candidate="$RUNNER_TEMP/repeat/$replay/$platform/sheet-open/actual"
            gh run download "$replay" -n "animation-candidate-$platform-sheet-open-attempt-1" -D "$candidate"
            if python shadcn/validation/animation_baseline.py "$platform" sheet-open --strict --gif \
              --baselines "$RUNNER_TEMP/reference" --output "$RUNNER_TEMP/repeat/$replay"; then
              echo "$replay" > "$RUNNER_TEMP/verified-replay"
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jetpack-sheet-reproducibility
          path: ${{ runner.temp }}/repeat/*/*/sheet-open/*.gif
          if-no-files-found: ignore
      - uses: actions/checkout@v4
        with:
          repository: csdog/compose-foundation-baselines
          ref: main
          token: ${{ secrets.COMPONENT_BASELINES_WRITE_TOKEN }}
          path: baseline-repository
      - name: Publish only the missing Jetpack lane
        run: |
          for platform in jetpack-compose; do
            source="$RUNNER_TEMP/reference/$platform/sheet-open"
            target="baseline-repository/animations/$platform/sheet-open"
            test ! -e "$target"
            mkdir -p "$target"
            cp "$source/"*.png "$target/"
            {
              printf '# Sheet opening on %s\n\n' "$platform"
              printf 'API 35 x86_64 Android emulator, Pixel 7 profile, Nova light. The Compose test clock samples every 16 ms through 480 ms.\n\n'
              printf 'Initial capture: https://github.com/csdog/compose-foundation/actions/runs/46120977722\n\n'
              printf 'Independent replay: https://github.com/csdog/compose-foundation/actions/runs/%s\n' "$(cat "$RUNNER_TEMP/verified-replay")"
            } > "$target/README.md"
          done
          git -C baseline-repository add -- animations/jetpack-compose/sheet-open
          git -C baseline-repository -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Add verified Jetpack Compose Sheet opening animation reference'
          git -C baseline-repository push origin HEAD:main
