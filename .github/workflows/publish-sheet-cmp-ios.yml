name: Publish verified Compose iOS Sheet references
on:
  push:
    branches: [codex/publish-sheet-cmp-ios]
permissions:
  contents: read
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the pinned simulator environment
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 -m pip install Pillow==11.3.0
      - name: Capture two independent Sheet openings
        run: |
          bash shadcn/validation/capture_sheet_ios.sh cmp-ios "$RUNNER_TEMP/first"
          bash shadcn/validation/capture_sheet_ios.sh cmp-ios "$RUNNER_TEMP/repeat"
      - name: Verify the candidate frames
        run: |
          path="$RUNNER_TEMP/reference/cmp-ios/sheet-open"
          mkdir -p "$path"
          cp "$RUNNER_TEMP/first/cmp-ios/sheet-open/actual/"*.png "$path/"
          python3 shadcn/validation/animation_baseline.py cmp-ios sheet-open --strict --gif \
            --baselines "$RUNNER_TEMP/reference" --output "$RUNNER_TEMP/repeat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmp-ios-sheet-verification
          path: |
            ${{ runner.temp }}/first/cmp-ios/sheet-open/recording.mov
            ${{ runner.temp }}/repeat/cmp-ios/sheet-open/recording.mov
            ${{ runner.temp }}/repeat/cmp-ios/sheet-open/comparison.gif
          if-no-files-found: ignore
      - uses: actions/checkout@v4
        with:
          repository: csdog/compose-foundation-baselines
          ref: main
          token: ${{ secrets.COMPONENT_BASELINES_WRITE_TOKEN }}
          path: baseline-repository
      - name: Publish the verified Compose iOS reference
        run: |
          target=baseline-repository/animations/cmp-ios/sheet-open
          test ! -e "$target"
          mkdir -p "$target"
          cp "$RUNNER_TEMP/reference/cmp-ios/sheet-open/"*.png "$target/"
          {
            printf '# Sheet opening on Compose iOS\n\n'
            printf 'iPhone 17 Pro simulator, iOS 26.2, Nova light. The trigger marker aligns samples every 16 ms through 768 ms.\n\n'
            printf 'Capture and independent replay: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$target/README.md"
          git -C baseline-repository add -- animations/cmp-ios/sheet-open
          git -C baseline-repository -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Add replay-verified Compose iOS Sheet opening reference'
          git -C baseline-repository push origin HEAD:main
