name: Component parity

on:
  workflow_dispatch:
    inputs:
      component:
        type: string
        default: tabs
      update:
        type: choice
        options: [review]
        default: review

permissions:
  contents: read

jobs:
  swiftui-tabs:
    name: Verify SwiftUI Tabs
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: csdog/compose-foundation-baselines
          ref: b19fcbf62f182422a5f26d7b8ce3dd8006695858
          sparse-checkout: |
            mobile/swiftui/tabs
            shadcn/tabs
          path: build/component-baselines
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Verify the macOS SwiftUI package
        run: swift build --package-path shadcn/iosApp
      - name: Capture the native iOS reference pairs
        run: |
          python shadcn/validation/report.py build/component-parity --run --platform swiftui-ios \
            --component tabs --baselines build/component-baselines --update-baselines \
            --bundle "$RUNNER_TEMP/swiftui-tabs-review"
      - name: Capture diagnostic logs
        if: failure()
        run: |
          if [[ -f build/component-parity/swiftui-ios/capture.log ]]; then
            tail -n 180 build/component-parity/swiftui-ios/capture.log
          fi
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: component-parity-shadcn-review-swiftui-ios
          path: ${{ runner.temp }}/swiftui-tabs-review
          retention-days: 7
          if-no-files-found: ignore
