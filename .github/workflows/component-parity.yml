          sources="$swiftui/Sources/ComposeFoundationSwiftUI"
          app="$RUNNER_TEMP/MenuKeyboardAudit.app"
          mkdir -p "$app/Contents/MacOS"
          plist="$app/Contents/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleExecutable -string MenuKeyboardAudit "$plist"
          plutil -insert CFBundleIdentifier -string com.composefoundation.menu-audit "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          xcrun swiftc -swift-version 6 -parse-as-library -target "$(uname -m)-apple-macos14.0" \
            "$sources"/Foundation{Theme,Popover,MenuGroups,Menubar,NavigationMenu}.swift \
            "$swiftui/validation/MacMenuKeyboardAudit.swift" -o "$app/Contents/MacOS/MenuKeyboardAudit"
          failed=0
          for mode in ltr rtl navigation navigation-rtl; do
            log="$RUNNER_TEMP/menu-$mode.log"
            args=("--$mode")
            if [[ "$mode" == navigation-rtl ]]; then
              args=(--navigation --rtl)
            fi
            open -n -W --stdout "$log" --stderr "$log" "$app" --args "${args[@]}" || failed=1
            cat "$log"
            grep -q '^PASS ' "$log" || failed=1
          done
          exit "$failed"

      - name: Verify Calendar navigation and date selection on macOS
        if: contains(needs.baseline.outputs.matrix, '"calendar"')
        timeout-minutes: 3
        run: |
          swiftui=shadcn/iosApp
          sources="$swiftui/Sources/ComposeFoundationSwiftUI"
          xcrun swiftc -swift-version 6 -parse-as-library \
            "$sources"/Foundation{Theme,CalendarNavigation,CalendarSelection,Checkbox}.swift \
            "$swiftui/validation/SelectionAudit.swift" -o "$RUNNER_TEMP/selection-audit"
          "$RUNNER_TEMP/selection-audit"

          app="$RUNNER_TEMP/CalendarAudit.app"
          mkdir -p "$app/Contents/MacOS"
          plist="$app/Contents/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleExecutable -string CalendarAudit "$plist"
          plutil -insert CFBundleIdentifier -string com.composefoundation.calendar-audit "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          xcrun swiftc -swift-version 6 -parse-as-library -target "$(uname -m)-apple-macos14.0" \
            "$sources"/Foundation{Theme,Calendar,CalendarNavigation,CalendarSelection}.swift \
            "$swiftui/validation/MacCalendarAudit.swift" -o "$app/Contents/MacOS/CalendarAudit"
          for direction in ltr rtl; do
            log="$RUNNER_TEMP/calendar-$direction.log"
            open -n -W --stdout "$log" --stderr "$log" "$app" --args "--$direction"
            cat "$log"
            grep -q '^PASS:' "$log"
          done

  report:
    name: Component parity report
    needs: [baseline, capture, cmp-behavior, swift-logic, publish]
    if: always() && needs.baseline.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize platform and interaction checks
        env:
          UPDATE_MODE: ${{ needs.baseline.outputs.update }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
          CAPTURE_MATRIX: ${{ needs.baseline.outputs.matrix }}
          CMP_RESULT: ${{ needs.cmp-behavior.result }}
          SWIFT_RESULT: ${{ needs.swift-logic.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo '## 跨平台组件验收'
            if [[ "$UPDATE_MODE" == publish ]]; then
              echo "基准发布：$PUBLISH_RESULT"
            elif [[ "$UPDATE_MODE" == review ]]; then
              echo '基准审核：下载各平台的 component-parity-shadcn-review 附件，打开 overview.png 查看候选图与 shadcn 对照。'
            else
              echo '日常回归：每个用例拍摄一遍。比对详情在各平台任务的 Summary，截图差异只在失败时上传。'
            fi
            echo
            echo "- 各平台截图：$CAPTURE_RESULT"
            echo "- CMP JVM Tabs 与 Popover 交互：$CMP_RESULT"
            echo "- SwiftUI Tabs 焦点与选择逻辑：$SWIFT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CAPTURE_RESULT" == success ]]
          if [[ "$GITHUB_EVENT_NAME" != pull_request_target ]]; then
            if jq -e 'any(.include[].platform; startswith("cmp-"))' <<< "$CAPTURE_MATRIX" >/dev/null; then
              [[ "$CMP_RESULT" == success ]]
            fi
            if jq -e 'any(.include[].platform; . == "swiftui-ios")' <<< "$CAPTURE_MATRIX" >/dev/null; then
              [[ "$SWIFT_RESULT" == success ]]
            fi
          fi
          [[ "$UPDATE_MODE" != publish || "$PUBLISH_RESULT" == success ]]
