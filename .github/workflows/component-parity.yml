name: SwiftUI control typography verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-logic:
    name: SwiftUI Tabs navigation logic
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify focus and selection rules
        run: |
          swiftui=shadcn/iosApp
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -swift-version 6 -parse-as-library \
            "$swiftui/Sources/ComposeFoundationSwiftUI/FoundationTabsNavigation.swift" \
            "$swiftui/validation/TabsNavigationAudit.swift" -o "$RUNNER_TEMP/tabs-navigation"
          "$RUNNER_TEMP/tabs-navigation"

      - name: Verify SwiftUI Button and Tabs typography
        run: |
          swiftui=shadcn/iosApp
          xcrun swiftc -swift-version 6 -parse-as-library \
            "$swiftui"/Sources/ComposeFoundationSwiftUI/*.swift \
            "$swiftui/validation/MacControlTypographyAudit.swift" -o "$RUNNER_TEMP/control-typography"
          "$RUNNER_TEMP/control-typography"

      - name: Reproduce the previous ancestor font override
        run: |
          ulimit -c 0
          swiftui=shadcn/iosApp
          styles=$swiftui/Sources/ComposeFoundationSwiftUI
          git fetch --no-tags --depth=1 origin 7d023e97427a946889adb42d4849629c23d262bb
          for file in FoundationButtonStyle.swift FoundationTabs.swift; do
            git show "FETCH_HEAD:$styles/$file" > "$styles/$file"
          done
          xcrun swiftc -swift-version 6 -parse-as-library "$styles"/*.swift \
            "$swiftui/validation/MacControlTypographyAudit.swift" -o "$RUNNER_TEMP/control-typography-before"
          if "$RUNNER_TEMP/control-typography-before" > "$RUNNER_TEMP/typography-before.log" 2>&1; then
            echo 'Expected the previous implementation to fail the typography regression'
            exit 1
          fi
          grep -F 'Unexpected font for Sera caption and weight' "$RUNNER_TEMP/typography-before.log"
