<!doctype html><meta charset="utf-8"><style>body{margin:0} .row{width:384px;height:80px;overflow-x:auto;display:flex;scrollbar-width:none;margin-bottom:40px}.card{flex:none;width:256px;height:80px;background:#ddd;margin-right:12px;scroll-snap-align:start}</style><div id="plain" class="row"><div style="flex:none;width:3000px;background:linear-gradient(90deg,red,blue)"></div></div><div id="snap" class="row" style="scroll-snap-type:x mandatory;scroll-padding-inline:4px"><div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div></div><script>window.audit=[];addEventListener('wheel',e=>audit.push({target:e.target.closest('.row').id,dx:e.deltaX,legacy:e.wheelDeltaX,mode:e.deltaMode}),{capture:true,passive:true})</script>
