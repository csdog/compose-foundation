# 冻结的 NGINX 回退清单；不参与正常发布。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compose-foundation-web
  namespace: web-foundation
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-alidns-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - compose-foundation.devops.cn.toutiaoyan.com
      secretName: compose-foundation-web-tls
  rules:
    - host: compose-foundation.devops.cn.toutiaoyan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compose-foundation-web
                port:
                  number: 80
