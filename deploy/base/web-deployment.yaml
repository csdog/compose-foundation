apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-foundation-web
  namespace: compose-foundation
  labels:
    app: compose-foundation-web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: compose-foundation-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: compose-foundation-web
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: web
          image: harbor.devops.toutiaoyan.com/web-foundation/compose-foundation-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
