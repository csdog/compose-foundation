server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    location /r/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
